name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python packages
        run: pip install -r requirements-dev.txt

      - name: Web version unit tests (JavaScript)
        run: node --test

      - name: Python unit tests, and Python vs web comparison
        run: pytest -v
